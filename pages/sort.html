<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown List Sorter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            font-family: monospace;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Markdown List Sorter</h1>
    <h2>Enter Your Markdown List:</h2>
    <textarea id="markdownInput" placeholder="- apple\n- orange\n- banana\n- grape"></textarea>
    <button onclick="sortList()">Sort Alphabetically</button>
    <h2>Sorted List:</h2>
    <textarea id="sortedOutput" readonly></textarea>

    <script>
        function sortList() {
            const input = document.getElementById('markdownInput').value;
            const lines = input.split('\n')
                .filter(line => line.trim() !== '') // Remove empty lines
                .map(line => line.trim());

            lines.sort(); // Sort lines alphabetically

            const sortedOutput = lines.map(line => line.startsWith('-') ? line : '- ' + line).join('\n');
            document.getElementById('sortedOutput').value = sortedOutput;
        }
    </script>
</body>
</html>
